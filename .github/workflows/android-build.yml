name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests and Build Debug & Signed Release APKs
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Prepare named APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Recover-debug.apk
          cp app/build/outputs/apk/release/app-release.apk Recover-release-signed.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recover-debug-apk
          path: Recover-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recover-release-signed-apk
          path: Recover-release-signed.apk

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Recover Android Build #${{ github.run_number }}"
          body: "Automated Android build of Recover (Splash + Onboarding 1-10 + Foundation). Includes V1/V2 signed Debug and Release APKs."
          files: |
            Recover-debug.apk
            Recover-release-signed.apk
